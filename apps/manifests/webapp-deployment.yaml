apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-webapp
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-webapp
  template:
    metadata:
      labels:
        app: demo-webapp
    spec:
      containers:
      - name: demo-webapp
        image: docker.io/esarathmails/demo-webapp:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_HOST
          value: postgres.default.svc.cluster.local
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: demo-webapp
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: demo-webapp
  ports:
  - port: 80
    targetPort: 3000
